# secrets.example.yaml — TEMPLATE ONLY. Do NOT apply this file as-is;
# the values below are placeholders. Copy it out of the repo, fill it
# in, and `kubectl apply -f` from your local filesystem.
#
# Real secrets in a git-tracked file is a hard no. For anything long-lived
# use SealedSecrets, SOPS, External Secrets Operator, or a Vault Agent —
# not a raw Secret with base64 values.
#
# All values are stringData (plain text) — Kubernetes base64-encodes them
# for you. Delete the keys you don't need.

apiVersion: v1
kind: Secret
metadata:
  name: jgair-backend-env
  namespace: jgair
type: Opaque
stringData:
  # ── Database ────────────────────────────────────────────
  # For the in-cluster Postgres StatefulSet:
  #   postgresql://journaladmin:CHANGE_ME@postgres.jgair.svc.cluster.local:5432/journaldb
  # For a managed service, paste the connection string from your provider.
  DATABASE_URL: "postgresql://journaladmin:CHANGE_ME@postgres.jgair.svc.cluster.local:5432/journaldb"

  # Consumed by the postgres StatefulSet ONLY. Safe to omit when
  # DATABASE_URL points at a managed service.
  POSTGRES_DB: "journaldb"
  POSTGRES_USER: "journaladmin"
  POSTGRES_PASSWORD: "CHANGE_ME"

  # ── Auth / JWT ──────────────────────────────────────────
  # Generate: openssl rand -hex 32
  SECRET_KEY: "CHANGE_ME_64_HEX_CHARS"
  ALGORITHM: "HS256"

  # ── CORS / URLs ─────────────────────────────────────────
  # Comma-separated list of origins allowed by CORS.
  ALLOW_ORIGINS: "https://jgair.example.org"
  FRONTEND_URL: "https://jgair.example.org"

  # ── OpenAI (reviewer matching + classification) ─────────
  OPENAI_API_KEY: "sk-CHANGE_ME"

  # ── Email (SendGrid) ────────────────────────────────────
  SENDGRID_API_KEY: "SG.CHANGE_ME"

  # ── Scheduled tasks HMAC ────────────────────────────────
  # The hourly CronJob uses this to authenticate against
  # POST /scheduled-tasks/run. Must match the value the API expects.
  SCHEDULED_TASKS_SECRET: "CHANGE_ME_LONG_RANDOM_TOKEN"

services:
  db:
    image: postgres:16
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: journaladmin
      POSTGRES_PASSWORD: journalpass
      POSTGRES_DB: journaldb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U journaladmin -d journaldb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend_network

  # Redis was previously spun up here for Celery. The backend replaced Celery
  # with an in-process InlineTask shim (see README) so Redis is no longer
  # required. When background durability comes back (BACKLOG.md JG-409),
  # restore a redis service and REDIS_URL here.

  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://journaladmin:journalpass@db:5432/journaldb
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:8000
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
    networks:
      - frontend_network

  # Daily pg_dump sidecar. Uses the stock postgres:15 image because it
  # already ships pg_dump/pg_restore; no custom build required. The
  # loop sleeps 24h between runs — good enough for a nightly cadence
  # without pulling in cron. Dumps land in the db_backups named volume
  # so they survive `docker compose down`.
  backup:
    image: postgres:15
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://journaladmin:journalpass@db:5432/journaldb
      RETENTION_DAYS: "30"
    volumes:
      - db_backups:/backups
      - ./backend/scripts:/scripts:ro
    command: ["sh", "-c", "while true; do /scripts/backup_db.sh; sleep 86400; done"]
    networks:
      - backend_network

networks:
  backend_network:
  frontend_network:

volumes:
  postgres_data:
  db_backups:

# Usage: `docker compose -f docker-compose.test.yml up -d` then
#        `TEST_DATABASE_URL=postgresql://test_user:test_pass@localhost:5433/test_db pytest backend/tests`
services:
  test_db:
    image: postgres:15
    container_name: jgair_test_db
    restart: "no"
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pass
      POSTGRES_DB: test_db
    tmpfs:
      # Keep data ephemeral — every `up` starts clean.
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_db"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
